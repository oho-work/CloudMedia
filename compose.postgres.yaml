# Add to compose.yaml when PostgreSQL should run in the same Compose project.
# DATABASE_URL in .env.docker must use postgres:5432 and the credentials below.
services:
  app:
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudmedia}
      POSTGRES_USER: ${POSTGRES_USER:-cloudmedia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
volumes:
  postgres-data:
