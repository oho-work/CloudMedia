name: cloudmedia
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudmedia:local
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.docker}
      PGSCHEMA: ${PGSCHEMA:-cloudmedia}
      APP_AUTH_TOKEN: ${APP_AUTH_TOKEN:?Set APP_AUTH_TOKEN in .env.docker}
      ALLOW_PRIVATE_UPSTREAM: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
